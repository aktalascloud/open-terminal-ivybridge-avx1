name: AVX1 verified candidates
on:
  workflow_dispatch:
    inputs:
      day:
        description: Build date YYYYMMDD
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: avx1-candidates
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, development]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.channel == 'stable' && 'stable-avx1' || 'avx1' }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Build, test, audit and package
        env:
          BUILD_CHANNEL: ${{ matrix.channel }}
          BUILD_DAY: ${{ inputs.day }}

        run: python .avx1/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ matrix.channel }}
          path: .avx1-out/*
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
