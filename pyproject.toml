[project]
name = "open-terminal"
version = "0.16.1"
description = "A remote computer API."
license = "MIT"
readme = "README.md"
authors = [
    { name = "Timothy Jaeryang Baek", email = "tim@openwebui.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "pydantic==2.13.4",
    "uvicorn[standard]==0.54.0",
    "click>=8.1.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    "aiofiles==25.1.0",
    "pypdf==6.21.4",
    "watchfiles==1.3.0",
    "websockets==15.0.1",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=1.0.0",
    "striprtf>=0.0.26",
    "xlrd>=2.0.0",
    "nbclient>=0.10.0",
    "ipykernel>=6.0.0",
    "pywinpty>=2.0.0; sys_platform == 'win32'",
    "pillow==13.0.0",
    "mss>=10.0.0; sys_platform == 'darwin' or sys_platform == 'win32'",
    "pyautogui>=0.9.54; sys_platform == 'darwin' or sys_platform == 'win32'",
    "pyperclip>=1.9.0; sys_platform == 'darwin' or sys_platform == 'win32'",
]

[project.optional-dependencies]
mcp = ["fastmcp>=4.0.0"]

[project.scripts]
open-terminal = "open_terminal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_terminal"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
